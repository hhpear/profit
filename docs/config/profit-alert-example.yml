# 联调配置模板。占位值必须由公司环境替换，不含可用凭据。
agent:
  task:
    agent-principals: profit-test,profit-production
    principal-secrets:
      profit-test: ${PROFIT_TEST_HMAC_SECRET}
      profit-production: ${PROFIT_PRODUCTION_HMAC_SECRET}
profit:
  identities:
    profit-test:
      mode: test
    profit-production:
      mode: production
  recipients:
    test:
      synthetic-reviewer: ${PROFIT_TEST_RECEIVER_ID}
    production: {} # 正式名单经确认后配置，不能回落到测试名单
  notice:
    url: ${PROFIT_NOTICE_DUBBO_URL}
    app: BusinessAlarm
    receive-id-type: user_id
  source:
    mapping-confirmed: false
    stable-read-confirmed: false
    customer-ids: []
    enterprise-names: {}
    dubbo-registry: ${PROFIT_BI_REGISTRY}
    dubbo-group: ${PROFIT_BI_GROUP:}
    dubbo-version: ${PROFIT_BI_VERSION:}
    mcp-url: ${PROFIT_MCP_URL}
    mcp-token: ${PROFIT_MCP_TOKEN}
