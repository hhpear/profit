spring:
  application:
    name: yuexin-bmp-agent-runtime

agent:
  runtime:
    enabled: ${AGENT_RUNTIME_ENABLED:false}
    agent-key: ${AGENT_RUNTIME_AGENT_KEY:customer-billing-agent}
    run-id: ${AGENT_RUNTIME_RUN_ID:}
    task-base-url: ${AGENT_TASK_BASE_URL:http://yuexin-bmp-agent-task:8080}
    hmac-secret: ${AGENT_TASK_HMAC_SECRET:}
    poll-interval-ms: ${AGENT_RUNTIME_POLL_INTERVAL_MS:5000}
    max-concurrency: ${AGENT_RUNTIME_MAX_CONCURRENCY:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
